services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url-shortener
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    entrypoint: ["sh", "-c"]
    command: >
      "for i in $(seq 1 10); do
        migrate -path /migrations -database postgres://postgres:postgres@postgres:5432/url-shortener?sslmode=disable up && exit 0;
        echo 'migrate failed, retrying in 2s...';
        sleep 2;
      done;
      exit 1"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    stop_grace_period: 30s
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/url-shortener?sslmode=disable
      BASE_URL: http://localhost:8080/
      APP_PORT: 8080
      GRPC_PORT: 9090
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:19092
      KAFKA_TOPIC: link-visited
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s

  analytics:
    build:
      context: .
      target: analytics
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/url-shortener?sslmode=disable
      KAFKA_BROKERS: kafka:19092
      KAFKA_TOPIC: link-visited
      KAFKA_GROUP_ID: url-shortener-analytics
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  kafka-init:
    image: apache/kafka:latest
    depends_on:
      kafka:
        condition: service_healthy

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        echo "Waiting for Kafka..."

        attempts=0
        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --list >/dev/null 2>&1; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 60 ]; then
            echo "Kafka did not become ready within 120 seconds" >&2
            exit 1
          fi
          sleep 2
        done

        echo "Creating Kafka topics..."

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create \
          --if-not-exists \
          --topic link-visited \
          --partitions 1 \
          --replication-factor 1

        echo "Kafka initialization completed"

volumes:
  pgdata:
